<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 296" width="1200" height="296" role="img" aria-label="Sentinel pre-execution verdict chain"><rect x="0" y="0" width="1200" height="296" rx="0" fill="#ffffff"/><text x="60" y="40" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#8250df" text-anchor="start" letter-spacing="3.4">PRE-EXECUTION VERDICTS</text><text x="1140" y="40" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#8c959f" text-anchor="end">Sentinel Protocol · OpenClaw + Sui</text><rect x="60" y="74" width="240" height="58" rx="11" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="78" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">openclaw agent</text><text x="78" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">attempts an action</text><rect x="340" y="74" width="240" height="58" rx="11" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/><text x="358" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">sentinel gate</text><text x="358" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">intercepts pre-execution</text><line x1="304" y1="103.0" x2="332" y2="103.0" stroke="#d0d7de" stroke-width="1.6"/><path d="M333,98.5 L339,103.0 L333,107.5 Z" fill="#d0d7de"/><rect x="620" y="74" width="240" height="58" rx="11" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/><text x="638" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">risk engine</text><text x="638" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">multi-signal scoring</text><line x1="584" y1="103.0" x2="612" y2="103.0" stroke="#d0d7de" stroke-width="1.6"/><path d="M613,98.5 L619,103.0 L613,107.5 Z" fill="#d0d7de"/><rect x="900" y="74" width="240" height="58" rx="11" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/><text x="918" y="100" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="600" fill="#1f2328" text-anchor="start">policy decision</text><text x="918" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">rules · behavior · semantic</text><line x1="864" y1="103.0" x2="892" y2="103.0" stroke="#d0d7de" stroke-width="1.6"/><path d="M893,98.5 L899,103.0 L893,107.5 Z" fill="#d0d7de"/><line x1="1020.0" y1="132" x2="1020.0" y2="158" stroke="#d0d7de" stroke-width="1.6"/><path d="M1020.0,158 H210.0 V192" fill="none" stroke="#d0d7de" stroke-width="1.6"/><path d="M205.5,193 L210.0,199 L214.5,193 Z" fill="#d0d7de"/><rect x="60" y="200" width="300" height="58" rx="11" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/><text x="78" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="start">ALLOW</text><text x="78" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">issue one-time token</text><path d="M1020.0,158 H570.0 V192" fill="none" stroke="#d0d7de" stroke-width="1.6"/><path d="M565.5,193 L570.0,199 L574.5,193 Z" fill="#d0d7de"/><rect x="420" y="200" width="300" height="58" rx="11" fill="#f6f8fa" stroke="#9a6700" stroke-width="1.5"/><text x="438" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#9a6700" text-anchor="start">REQUIRE_APPROVAL</text><text x="438" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">human challenge</text><path d="M1020.0,158 H930.0 V192" fill="none" stroke="#d0d7de" stroke-width="1.6"/><path d="M925.5,193 L930.0,199 L934.5,193 Z" fill="#d0d7de"/><rect x="780" y="200" width="300" height="58" rx="11" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5"/><text x="798" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#cf222e" text-anchor="start">BLOCK</text><text x="798" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8c959f" text-anchor="start">hard stop · kill switch</text><text x="60" y="278" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#8c959f" text-anchor="start">every decision and verdict is hash-chained, batched into a Merkle tree, and anchored to Sui as an on-chain event</text></svg>