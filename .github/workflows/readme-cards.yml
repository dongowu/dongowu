name: Update README cards

# Regenerates the statistics cards locally in CI and commits the SVG back into
# the repository. This replaces the public github-readme-stats instance, which
# is no longer maintained and now returns 502 to GitHub's camo image proxy --
# meaning the cards were broken for every visitor, not just some networks.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Several workflows in this repository commit back to main. Serialising this
# one and rebasing before the push keeps a scheduled run from being rejected
# by whatever else happened to push first.
concurrency:
  group: profile-assets

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Card options must stay in sync with the committed SVGs' look: the light
      # cards use the brand purple (#8250df), dark cards keep the tokyonight
      # palette. Drift here would silently restyle the profile on the next run.
      - name: Generate stats card (light)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&rank_icon=github&theme=default&bg_color=00000000&title_color=8250df&icon_color=8250df
          path: profile/stats.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate stats card (dark)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&rank_icon=github&theme=tokyonight&bg_color=00000000
          path: profile/stats-dark.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate top languages card (light)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=default&bg_color=00000000&title_color=8250df
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate top languages card (dark)
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=tokyonight&bg_color=00000000
          path: profile/top-langs-dark.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Commit cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/*.svg
          git diff --staged --quiet || git commit -m 'Update profile cards'
          git pull --rebase --autostash origin main
          git push
