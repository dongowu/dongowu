name: Generate Snake Animation

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# See readme-cards.yml: the same group keeps the committing workflows from
# racing each other, and the rebase absorbs pushes from the others.
concurrency:
  group: profile-assets

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit snake animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/*.svg
          git diff --staged --quiet || git commit -m 'Update snake animation'
          git pull --rebase --autostash origin main
          git push
